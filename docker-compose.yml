services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ci3-api
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ci3-network
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    container_name: ci3-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ci3-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ci3-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ci3-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ci3-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ci3-network
    restart: unless-stopped

networks:
  ci3-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: